[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "ninja",
]
build-backend = "setuptools.build_meta"

[tool.mypy]
files = "setup.py"
python_version = "3.7"
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ninja"]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",
]
testpaths = ["tests"]

[tool.cibuildwheel]
skip =  ["pp*", "*-win32", "*-manylinux_i686", "*-musllinux_i686"]
build-verbosity = 1

# Install system dependencies before building wheels
# This ensures OpenSSL is available for CMake and cmake is installed from system packages
before-all = [
    # For manylinux (yum-based)
    "yum install -y openssl-devel cmake3 || yum install -y openssl-devel cmake || true",
    # For debian-based systems  
    "apt-get update && apt-get install -y libssl-dev cmake || true",
]

# macOS-specific configuration
[tool.cibuildwheel.macos]
before-all = [
    "brew install cmake openssl || true",
]

# Windows doesn't need special OpenSSL setup for cmake
[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"


